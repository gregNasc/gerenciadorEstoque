<div class="{{ col|default:'col-12' }}">
    <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="text-danger" aria-label="obrigatório"> *</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
    {% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}
</div>
